name: Build LIKEALINUX Kiryu ARM64 ISO (Debian Docker)

on:
  push:
    branches: [ "main", "arm64-v0" ]
  pull_request:
    branches: [ "main", "arm64-v0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build ISO inside Debian Container
      run: |
        # Run a privileged Debian Trixie container to build the ISO
        docker run --privileged --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          debian:trixie-slim bash -c "
            # 1. Install required build tools inside the container
            apt-get update && apt-get install -y live-build debootstrap distro-info-data

            # 2. Clean up any previous runs
            lb clean --purge
            rm -rf .build/

            # 3. Configure the live environment
            lb config \
            --distribution trixie \
            -a arm64 \
            --apt-recommends true \
            --chroot-squashfs-compression-type zstd \
            --mirror-chroot-security https://security.debian.org/debian-security/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --image-name LIKEALINUX_Kiryu \
            --updates true \
            --firmware-chroot true \
            --linux-flavours "arm64" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --iso-application "KazumaKiryu" \
            --iso-publisher "pbk123461" \
            --iso-volume "LIKEALINUX0" \
            --binary-images iso-hybrid \
            --system live \
            --bootappend-live "boot=live components quiet splash username=kiryulive hostname=LikeALinux" \
            --hdd-label "DojimaHQ" \
            --build-with-chroot true 

            # 4. Run the build
            lb build

            # 5. Rename output artifact inside the workspace
            echo 'Renaming ISO output...'
            mv *.iso LIKEALINUX_Kiryu-arm64.iso
          "

    - name: Upload Finished ISO
      uses: actions/upload-artifact@v4
      with:
        name: LIKEALINUX_Kiryu-ARM64-ISO
        path: LIKEALINUX_Kiryu-arm64.iso
        if-no-files-found: error
