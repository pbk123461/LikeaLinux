name: Build LIKEALINUX Kiryu ARM64 ISO (GNU Coreutils)

on:
  push:
    branches: [ "main", "arm64-v0"]
  pull_request:
    branches: [ "main", "arm64-v0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Ensure GNU Coreutils and Install Live Build Tooling
      run: |
        sudo apt-get update
        # Explicitly ensure coreutils, GNU sed, grep, and tar are present
        sudo apt-get install -y --reinstall coreutils sed grep tar findutils
        sudo apt-get install -y live-build debootstrap distro-info-data

    - name: Configure and Build ISO
      run: |
        # Clean any previous artifact traces
        sudo lb clean --purge
        sudo rm -rf .build/

        # Core live-build configuration (unrecognized flags removed)
        sudo lb config \
          --distribution trixie \
          -a arm64 \
          --apt-recommends true \
          --mirror-chroot-security https://security.debian.org/debian-security/ \
          --mirror-binary https://deb.debian.org/debian/ \
          --mirror-bootstrap https://deb.debian.org/debian/ \
          --firmware-chroot true \
          --linux-flavours "arm64" \
          --archive-areas "main contrib non-free non-free-firmware" \
          --iso-application "KazumaKiryu" \
          --iso-publisher "pbk123461" \
          --iso-volume "LIKEALINUX0" \
          --binary-images iso-hybrid \
          --system live \
          --bootappend-live "boot=live components quiet splash username=kiryulive hostname=LikeALinux" \
          --hdd-label "DojimaHQ" \
          --build-with-chroot true 

        # Execute the build
        sudo lb build

        # Rename the generated ISO to your custom name
        echo "Renaming ISO output..."
        sudo mv *.iso LIKEALINUX_Kiryu-arm64.iso

    - name: Upload Finished ISO
      uses: actions/upload-artifact@v4
      with:
        name: LIKEALINUX_Kiryu-ARM64-ISO
        # Target the explicitly renamed file
        path: LIKEALINUX_Kiryu-arm64.iso
        if-no-files-found: error

    - name: Upload Finished ISO
      uses: actions/upload-artifact@v4
      with:
        name: LIKEALINUX_Kiryu-ARM64-ISO
        path: "*.iso"
        if-no-files-found: error
