name: Build LIKEALINUX Kiryu ARM64 ISO (Debian Docker)

on:
  push:
    branches: [ "main", "arm64-v0" ]
  pull_request:
    branches: [ "main", "arm64-v0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build ISO inside Debian Container
      run: |
        # 1. Capture host user details so we can fix permissions later
        HOST_UID=$(id -u)
        HOST_GID=$(id -g)

        # 2. Run a privileged Debian Trixie container to build the ISO
        docker run --privileged --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          debian:trixie-slim bash -c "
            # Install required build tools inside the container
            apt-get update && apt-get install -y live-build debootstrap distro-info-data

            # Clean up any previous runs
            lb clean --purge
            rm -rf .build/

            # Configure the live environment (corrected for Debian Trixie)
            lb config \
              --distribution trixie \
              -a arm64 \
              --apt-recommends true \
              --mirror-binary https://deb.debian.org/debian/ \
              --mirror-bootstrap https://deb.debian.org/debian/ \
              --security true \
              --updates true \
              --backports true \
              --firmware-chroot true \
              --linux-flavours 'arm64' \
              --archive-areas 'main contrib non-free non-free-firmware' \
              --iso-application 'KazumaKiryu' \
              --iso-publisher 'pbk123461' \
              --iso-volume 'LIKEALINUX0' \
              --binary-images iso-hybrid \
              --system live \
              --bootappend-live 'boot=live components quiet splash username=kiryulive hostname=LikeALinux' \
              --hdd-label 'DojimaHQ' \
              --build-with-chroot true 
              

            # Run the build toolchain
            lb build

            # Pass workspace file ownership back to the host user so GitHub can read it
            echo 'Fixing file permissions...'
            chown -R $HOST_UID:$HOST_GID /workspace

            # Safely catch, locate, and rename the output ISO file inside the container context
            ISO_NAME=\$(ls *.iso 2>/dev/null | head -n 1)
            if [ -n \"\$ISO_NAME\" ]; then
                echo \"Renaming \$ISO_NAME to LIKEALINUX_Kiryu-arm64.iso\"
                mv \"\$ISO_NAME\" LIKEALINUX_Kiryu-arm64.iso
            else
                echo 'ERROR: live-build failed to generate an ISO file!'
                exit 1
            fi
          "

    - name: Upload Finished ISO
      uses: actions/upload-artifact@v4
      with:
        name: LIKEALINUX_Kiryu-ARM64-ISO
        path: LIKEALINUX_Kiryu-arm64.iso
        if-no-files-found: error
